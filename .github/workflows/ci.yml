name: Build and publish

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

# trunk is production: every push to it derives a new version from the git
# history and publishes a GitHub Release binary + a GHCR image. A pull request
# builds everything but publishes nothing (and never sees the credentials).
permissions:
  contents: write # create the Release + its tag
  packages: write # push the image to GHCR

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run.ts check
      - name: Test
        run: bun run.ts test

  publish:
    runs-on: ubuntu-latest
    needs: test # nothing is published unless the tests pass
    steps:
      # The whole history, because the version's minor is the commit count and
      # the default shallow checkout would make every build claim to be the
      # first. run.ts refuses to compute a version from a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile

      - name: Version
        id: version
        run: echo "value=$(bun run.ts version)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Only a real trunk push (not a PR, which may come from a fork) publishes.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          # The Dockerfile cross-compiles with Bun from the build platform, so
          # arm64 costs seconds, not a QEMU toolchain.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk' }}
          # :latest is what compose pulls; the exact version is what makes it
          # possible to pin one, and to roll back to one.
          tags: |
            ghcr.io/danielbodart/treesinger:latest
            ghcr.io/danielbodart/treesinger:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Both binaries, the plain unit and sysusers file, treesinger-env and
      # their checksums, into dist/release.
      - name: Build release
        run: bun run.ts release

      # A release whose binary disagrees with its tag is worse than none.
      - name: Check the version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          built=$(dist/release/treesinger-linux-x64 version)
          [ "$built" = "$VERSION" ] || { echo "the binary says $built but the release is $VERSION"; exit 1; }

      # The VM test in nix/test.nix runs this unit for real, but CI does not run
      # it, so the unit is at least checked against a real systemd here, with
      # its user and its binary where it expects them.
      - name: Verify the systemd unit
        run: |
          sudo install -m 755 dist/release/treesinger-linux-x64 /usr/local/bin/treesinger
          sudo systemd-sysusers "$PWD/contrib/systemd/treesinger.sysusers"
          systemd-analyze verify contrib/systemd/treesinger.service

      # A re-run has the same run number and so the same version; the action
      # then updates that release and replaces its assets rather than failing.
      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          files: dist/release/*
