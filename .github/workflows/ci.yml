name: Build and publish

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

# trunk is production: every push to it derives a new version from the git
# history and publishes a GitHub Release binary + a GHCR image. A pull request
# builds everything but publishes nothing (and never sees the credentials).
permissions:
  contents: write # create the Release + its tag
  packages: write # push the image to GHCR

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Format and vet
        run: ./run check
      - name: Test
        run: ./run test

  # The flake: the package (its build runs the tests) and the NixOS VM test,
  # which boots the module and the plain units for real. Deliberately not in
  # publish's `needs`: a VM test is slow and can be flaky on shared runners,
  # and a flaky VM must not block a release. A red run here is still a red
  # build to fix.
  nix:
    runs-on: ubuntu-latest
    permissions:
      contents: read # it publishes nothing
    steps:
      # The whole history, so the flake's version has its commit count.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Hosted runners have /dev/kvm, but not readable by the runner's user;
      # without it the VM test falls back to emulation, many times slower.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
      - name: VM test
        run: nix build -L .#checks.x86_64-linux.nixos
      # Everything else in the flake, the VM test already built above.
      - name: Flake check
        run: nix flake check -L

  publish:
    runs-on: ubuntu-latest
    needs: test # nothing is published unless the tests pass
    steps:
      # The whole history, because the version's minor is the commit count and
      # the default shallow checkout would make every build claim to be the
      # first. ./run refuses to compute a version from a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4

      - name: Version
        id: version
        run: echo "value=$(./run version)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Only a real trunk push (not a PR, which may come from a fork) publishes.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          # The Dockerfile cross-compiles with Go from the build platform, so
          # arm64 costs seconds, not a QEMU toolchain.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk' }}
          # :latest is what compose pulls; the exact version is what makes it
          # possible to pin one, and to roll back to one.
          tags: |
            ghcr.io/danielbodart/treesinger:latest
            ghcr.io/danielbodart/treesinger:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Both binaries, the plain units and sysusers file, and their checksums,
      # into dist/release.
      - name: Build release
        run: ./run release

      # A release whose binary disagrees with its tag is worse than none.
      - name: Check the version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          built=$(dist/release/treesinger-linux-x64 version)
          [ "$built" = "$VERSION" ] || { echo "the binary says $built but the release is $VERSION"; exit 1; }

      # The nix job boots these units for real, but does not gate this one, so
      # they are at least checked against a real systemd here, with their user
      # and their binary where they expect them. Verified together, so each
      # finds the units it names.
      - name: Verify the systemd units
        run: |
          sudo install -m 755 dist/release/treesinger-linux-x64 /usr/local/bin/treesinger
          sudo systemd-sysusers "$PWD/contrib/systemd/treesinger.sysusers"
          systemd-analyze verify contrib/systemd/treesinger.service \
            contrib/systemd/treesinger.socket contrib/systemd/treesinger-admin.socket

      # A re-run has the same run number and so the same version; the action
      # then updates that release and replaces its assets rather than failing.
      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          files: dist/release/*
