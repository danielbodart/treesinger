name: CI

# Every push to the default branch is tested in every channel: mise's checks,
# the flake with its NixOS VM test, the image run, and the tarball installed
# under a real systemd. A release - the images and a GitHub release of the
# same version - waits for all of them, and is made only when something it is
# built from (./run's RELEASE_PATHS) changed since the last release tag, or a
# dispatch asks for one with `release`. The weekly update dispatches it so.

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release even if nothing in RELEASE_PATHS changed since the last release
        type: boolean
        default: false

# Least privilege for the built-in token. Read-only by default, and widened
# only on the job that publishes. Without this every job inherits whatever the
# repository default happens to be, which on many repositories is read *and
# write*.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # mise.toml pins Go, for CI and for anyone working on this locally.
      - uses: jdx/mise-action@v5
      - run: mise run check

  # The flake: the package (its build runs the tests) and the NixOS VM test,
  # which boots the module and the plain units for real.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Hosted runners have /dev/kvm, but not readable by the runner's user;
      # without it the VM test falls back to emulation, many times slower.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31

      # Read from the cache, and push only the package below: never the VM
      # test's closure, which would fill the free tier.
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Flake check
        run: nix flake check -L

      - name: Push the package to Cachix
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: nix build .#default --print-out-paths | cachix push danielbodart

  # Everything the upstream channel ships, built once, by mise's Go: the
  # images, the tests below and the release all use these bytes.
  dist:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      release: ${{ steps.due.outputs.value }}
    steps:
      # The whole history and its tags: the version's minor is the commit
      # count, which ./run refuses to compute from a shallow clone, and
      # whether to release is a diff from the last release tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: mise run dist

      - name: Version
        id: version
        run: echo "value=$(cat dist/version)" >> "$GITHUB_OUTPUT"

      - name: Release?
        id: due
        env:
          FORCE: ${{ inputs.release }}
        run: |
          if [ "$FORCE" = true ] || ./run release-due; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      # Tarred, because an artifact does not keep the binaries' mode.
      - run: tar -cf dist.tar dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist.tar

  # The image for amd64, built from dist/ and run: it must say its version.
  docker:
    runs-on: ubuntu-latest
    needs: dist
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - run: tar -xf dist.tar
      - uses: docker/setup-buildx-action@v4
      - run: ./run smoke

  # The x64 tarball unpacked and installed as the docs say, and its units
  # checked against a real systemd, with their user and the binary where they
  # expect them.
  tarball:
    runs-on: ubuntu-latest
    needs: dist
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - run: tar -xf dist.tar
      - run: ./run install-check

  release:
    runs-on: ubuntu-latest
    needs: [check, nix, dist, docker, tarball]
    if: >-
      github.event_name != 'pull_request'
      && github.ref_name == github.event.repository.default_branch
      && needs.dist.outputs.release == 'true'
    permissions:
      contents: write
      packages: write
      # cosign's keyless signing: the run's OIDC identity is the signer.
      id-token: write
    env:
      VERSION: ${{ needs.dist.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - run: tar -xf dist.tar
      - uses: jdx/mise-action@v5

      # Each asset gets a sigstore bundle beside it, as capsper's tarballs do:
      # `cosign verify-blob --bundle <asset>.sigstore.json` proves this
      # workflow, on this repository, built it.
      - name: Sign
        run: |
          for f in dist/release/*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - uses: docker/setup-buildx-action@v4

      # The image's org.opencontainers.image.source label links the package
      # to this repository.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the images
        uses: docker/build-push-action@v7
        with:
          context: .
          # Each image only copies its binary in, so no architecture is
          # emulated.
          platforms: linux/amd64,linux/arm64
          push: true
          # :latest is what compose pulls; the exact version is what makes it
          # possible to pin one, and to roll back to one.
          tags: |
            ghcr.io/danielbodart/treesinger:latest
            ghcr.io/danielbodart/treesinger:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}

      # A re-run has the same run number and so the same version, so the
      # release may already exist: its assets are replaced rather than the job
      # failing.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --clobber
          else
            {
              git log -1 --format=%B "$GITHUB_SHA"
              echo
              echo "Image: \`ghcr.io/danielbodart/treesinger:$VERSION\`"
            } > notes.md
            gh release create "$tag" dist/release/* --target "$GITHUB_SHA" --title "$tag" --latest --notes-file notes.md
          fi
