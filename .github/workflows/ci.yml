name: Build and publish

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

# trunk is production: every push to it derives a new version from the git
# history and publishes a GitHub Release binary + a GHCR image. A pull request
# builds everything but publishes nothing (and never sees the credentials).
permissions:
  contents: write # create the Release + its tag
  packages: write # push the image to GHCR

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run.ts check
      - name: Test
        run: bun run.ts test

  publish:
    runs-on: ubuntu-latest
    needs: test # nothing is published unless the tests pass
    steps:
      # The whole history, because the version's minor is the commit count and
      # the default shallow checkout would make every build claim to be the
      # first. run.ts refuses to compute a version from a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile

      - name: Version
        id: version
        run: echo "value=$(bun run.ts version)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Only a real trunk push (not a PR, which may come from a fork) publishes.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk' }}
          # :latest is what compose pulls; the exact version is what makes it
          # possible to pin one, and to roll back to one.
          tags: |
            ghcr.io/danielbodart/treesinger:latest
            ghcr.io/danielbodart/treesinger:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build binary
        run: bun run.ts build dist/treesinger-linux-x64

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          files: dist/treesinger-linux-x64
